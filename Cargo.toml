[workspace]
resolver = "3"
members = ["userdomain", "userdomain-daemon", "userdomain-common", "userdomain-ebpf"]
default-members = ["userdomain", "userdomain-daemon", "userdomain-common"]

[workspace.package]
license = "MIT"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
aya = "0.14.0"
aya-build = "0.2.0"
aya-ebpf = "0.2.1"
cargo_metadata = "0.23.1"
dbus = "0.9.12"
dbus-crossroads = "0.5.3"
dbus-tokio = "0.7.6"
libc = "0.2.190"
network-types = "0.2.0"
tokio = "1.53.2"
which = "8.0.6"

[profile.release.package.userdomain-ebpf]
debug = 2
codegen-units = 1
strip = false
